<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retira</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--sf:#fff;--ink:#14261C;--mut:#5E6B63;--ln:#DDE3DE;--pri:#024A27;--onp:#fff;--acc:#8E5B1A;--ok:#1E7A45;--wa:#8E5B1A;--er:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media not all{:root:not([data-theme="light"]){--bg:#0B1510;--sf:#13211A;--ink:#E8F1ED;--mut:#93A89F;--ln:#2A433A;--pri:#5CB98A;--onp:#04180E;--acc:#C98B3E;--ok:#5ED197;--wa:#D9A055;--er:#FF8A80}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
#app{max-width:480px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:28px;line-height:1.1;margin:8px 0 6px;font-weight:800}h2{font-size:19px;margin:22px 0 8px;font-weight:600}
p{margin:6px 0}.mut{color:var(--mut);font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
.hero{background:#024A27;color:#fff;border-radius:20px;padding:20px;margin:10px 0}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-1px}.hero .mut{color:inherit;opacity:.8}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:12px 0 8px;background:#0003}
.bar i{display:block}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:600 16px inherit;font-family:inherit;background:var(--pri);color:var(--onp);cursor:pointer;margin-top:12px}
.btn.sec{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}.btn:disabled{opacity:.45}
input,select,textarea{width:100%;font:inherit;padding:12px;border-radius:10px;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);margin-top:4px}
label{display:block;margin-top:12px;font-weight:600;font-size:14px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px}.chk input{width:20px;height:20px;margin:2px 0 0;flex:none}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.s-ok{color:var(--ok)}.s-wa{color:var(--wa)}.s-er{color:var(--er)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:480px;width:100%}nav button{flex:1;background:none;border:0;padding:12px 2px;font:600 13px inherit;font-family:inherit;color:var(--mut);cursor:pointer;border-top:3px solid transparent}
nav button.on{color:var(--pri);border-top-color:var(--acc)}
.steps{display:flex;gap:6px;margin:6px 0 14px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--ln)}.steps i.on{background:var(--acc)}
.note{border-left:4px solid var(--acc);padding:8px 12px;background:var(--sf);border-radius:0 10px 10px 0;font-size:14px;margin:10px 0}
details{border-bottom:1px solid var(--ln);padding:10px 0}summary{font-weight:600;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.chips button{border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.err{color:var(--er);font-size:14px;margin-top:6px}
.splash{position:fixed;inset:0;z-index:20;background:#024A27;color:#fff;display:grid;place-items:center;text-align:center;padding:24px}.splash h1{font-size:44px;margin:14px 0 4px}.splash p{opacity:.85;margin:0}.mk{width:84px;height:84px;border-radius:50%;background:#8E5B1A;display:grid;place-items:center;margin:0 auto;font-size:44px;font-weight:800;animation:pop .6s ease-out both}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}@media (prefers-reduced-motion:reduce){.mk{animation:none}}
.eye{background:#fff3;color:#fff;border:0;border-radius:99px;padding:6px 12px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.qa{display:flex;gap:6px;justify-content:space-between}.qa button{flex:1;background:none;border:0;color:var(--ink);font:600 12px inherit;font-family:inherit;cursor:pointer;padding:0}
.qa b{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;margin:0 auto 6px;background:#024A27;color:#fff;font-size:22px}.qa button:nth-child(even) b{background:#8E5B1A}
.ic{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#024A27;color:#fff;flex:none;font-size:16px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.acct{font-size:30px;font-weight:800;letter-spacing:1px}
.cp{border:1.5px solid var(--pri);background:transparent;color:var(--pri);border-radius:99px;padding:6px 14px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.good{color:var(--ok);font-weight:600;font-size:14px}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--ln);border-top-color:var(--pri);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes sp{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style></head><body><div id="app"></div><nav id="nav" hidden><div></div></nav>
<script>
const N=n=>"₦"+Number(n).toLocaleString("en-NG");
const D=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const ago=m=>new Date(Date.now()-m*864e5);
const S={view:"splash",step:0,tab:"home",err:"",amt:"",toast:"",oc:{phone:"",ok:[],nin:"",rsa:"no",ack:[]},
 total:186500,split:.4,last:new Date(),
 tx:[{ref:"RTR-4F2A91",d:ago(9),a:30000,s:"Successful"},{ref:"RTR-7C10BE",d:ago(31),a:56500,s:"Successful"},{ref:"RTR-2B88D5",d:ago(68),a:100000,s:"Successful"}],
 firstContribDays:68,wd:[],cases:[],pend:null,cat:"Contribution not reflected"};
const $=s=>document.querySelector(s),sc=s=>s==="Successful"||s==="Paid"||s==="Approved"?"s-ok":s==="Failed"||s==="Rejected"?"s-er":"s-wa";
const pill=s=>`<span class="pill ${sc(s)}">${s}</span>`;
const cont=()=>Math.round(S.total*S.split),ret=()=>S.total-cont();
const pend=()=>S.tx.filter(t=>t.s!=="Successful"&&t.s!=="Failed").length;
function go(v,x){Object.assign(S,{view:v,err:"",toast:""},x||{});draw()}
function save(k,v){S[k]=v}
const STEPS=["Phone","Eligibility","Identity"];
function onb(){const o=S.oc,i=S.step;let h=`<h1>Retira</h1><p class="mut">Save your way. Retire with a plan.</p><div class="steps">${STEPS.map((_,j)=>`<i class="${j<=i?"on":""}"></i>`).join("")}</div>`;
 if(i===0&&o.sent)h+=`<h2>Enter your code</h2><p class="mut">We sent a 6-digit code to ${o.phone}. Demo: the code is 123456.</p><label>Verification code<input id="cd" inputmode="numeric" maxlength="6" placeholder="••••••"></label><div class="err">${S.err}</div><button class="btn" onclick="vc()">Verify and continue</button>`;
 if(i===0&&!o.sent)h+=`<h2>Create your account</h2><label>Mobile number<input id="ph" inputmode="tel" placeholder="0803 000 0000" value="${o.phone}"></label><p class="mut">We’ll send a code to verify this number.</p><div class="err">${S.err}</div><button class="btn" onclick="n0()">Send code</button>`;
 if(i===1)h+=`<h2>Check your eligibility</h2><p class="mut">Tick what applies to you.</p>${[["I earn income outside regular salaried employment","a"],["I am 18 or older","b"],["I am a Nigerian resident with a NIN","c"]].map(([t,k])=>`<label class="chk"><input type="checkbox" ${o.ok.includes(k)?"checked":""} onchange="tg('ok','${k}')">${t}</label>`).join("")}<div class="note">Final eligibility is confirmed by your Pension Fund Administrator (PFA).</div><div class="err">${S.err}</div><button class="btn" onclick="n1()">Continue</button>`;
 if(i===2)h+=`<h2>Verify your identity</h2><label>Full name (as on your NIN)<input id="nm" autocomplete="name" value="${o.name||""}" placeholder="e.g. Adaeze Okafor"></label><label>National Identification Number (NIN)<input id="nin" inputmode="numeric" maxlength="11" value="${o.nin}" placeholder="11 digits"></label><label>Do you already have an RSA?<select id="rsa"><option value="no">No, I need a new one</option><option value="yes" ${o.rsa==="yes"?"selected":""}>Yes, with a PFA</option></select></label><p class="mut">If you already have an RSA, we’ll guide you through your existing PFA’s process so you don’t get a duplicate.</p><div class="err">${S.err}</div><button class="btn" onclick="n2()">Submit to PFA</button>`;
 if(i===4)h+=`<div class="card"><h2 style="margin-top:0">Waiting for your PFA</h2><p class="mut">Your registration is with the PFA. Onboarding is complete only when their checks pass.</p>${pill("Pending")}</div><button class="btn" onclick="go('app',{tab:'home'})">Simulate PFA approval</button>`;
 return h}
function tg(k,v){const a=S.oc[k];a.includes(v)?a.splice(a.indexOf(v),1):a.push(v)}
function n0(){const v=$("#ph").value.replace(/\s/g,"");if(!/^0\d{10}$/.test(v)){S.err="Enter an 11-digit number starting with 0.";return draw()}S.oc.phone=v;S.oc.sent=1;S.err="";draw()}
function vc(){if($("#cd").value!=="123456"){S.err="That code doesn’t match. Check it and try again.";return draw()}S.oc.sent=0;S.step=1;S.err="";draw()}
function n1(){if(S.oc.ok.length<3){S.err="All three must apply before your PFA can review you.";return draw()}S.step=2;S.err="";draw()}
function n2(){const v=$("#nin").value,nm=$("#nm").value.trim().replace(/[<>&"]/g,"");S.oc.rsa=$("#rsa").value;S.oc.nin=v;S.oc.name=nm;if(nm.length<3){S.err="Enter your full name as it appears on your NIN.";return draw()}if(!/^\d{11}$/.test(v)){S.err="NIN verification failed: enter all 11 digits, then try again.";S.oc.nin=v;return draw()}S.oc.nin=v;S.err="";if(S.oc.rsa==="yes"){S.err="You already have an RSA. Contact your current PFA to add voluntary contributions. For this demo, choose “No” to continue.";return draw()}S.step=4;draw()}

function home(){const c=cont(),r=ret(),p=pend();
 return `<h1>${S.oc.name?S.oc.name+"’s pension":"Your pension"}</h1><div class="hero"><div class="mut">Total balance</div><div class="row"><div class="big">${S.hide?"₦ ••••••":N(S.total)}</div><button class="eye" onclick="S.hide=!S.hide;draw()">${S.hide?"Show":"Hide"}</button></div></div>
 <p class="mut">Last updated ${S.last.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}, ${D(S.last)}.</p>
 ${p?`<div class="note">${p} contribution${p>1?"s":""} awaiting PFA acknowledgement. Not counted in your balance yet.</div>`:""}
 <h2>Recent contributions</h2>${S.tx.map(t=>`<div class="card row"><span class="ic">^</span><div style="flex:1"><b>${N(t.a)}</b><div class="mut">${D(t.d)} · ${t.ref}</div></div>${pill(t.s)}</div>`).join("")}`}
function learn(){const q=[["How does this pension work?","Your contributions go into a Retirement Savings Account (RSA) run by a licensed PFA. A custodian holds the assets. Retira is the app you use to see and manage it."],["What is the contingent part?","40% of each contribution. It works like emergency or business cash: you can withdraw from it before retirement. Your PFA confirms the exact split on your account."],["When can I make my first withdrawal?","Three months after your first contribution. After that, the September 2025 guidelines allow a withdrawal at most once every two calendar months. Your PFA confirms the current limit."],["How long does a withdrawal take?","Eligible, complete requests are paid to your verified bank account, and the guidelines provide for payment within 24 hours. The PFA assesses and pays, not Retira."],["What is the retirement part?","The other 60%. It is locked and keeps growing until you reach retirement age (from 50) or face serious health grounds. It is not freely withdrawable cash."],["Who approves withdrawals?","Your PFA. Retira only sends your request and shows its status."],["What about fees and risk?","Fund 5A and 5B details, fees and past performance come from your PFA. Values can go down as well as up."],["I need help with a deceased contributor’s benefits","Use Help to start an enquiry. The PFA’s death-benefit process applies."]];
 return `<h1>FAQ</h1><p class="mut">Plain answers. Regulated advice comes from your PFA.</p>${q.map(([a,b])=>`<details><summary>${a}</summary><p class="mut">${b}</p></details>`).join("")}`}
function help(){const cats=["Registration and onboarding","Identity verification","Contribution not reflected","Incorrect transaction status","Balance or statement discrepancy","Withdrawal request","Account information update","Other pension enquiries"];
 return `<h1>Help</h1><p class="mut">Tell us what happened. We’ll say who is responsible for fixing it.</p><label>Issue<select id="ct" onchange="S.cat=this.value">${cats.map(c=>`<option ${c===S.cat?"selected":""}>${c}</option>`).join("")}</select></label><label>Transaction reference (optional)<input id="rf" placeholder="e.g. RTR-4F2A91"></label><label>Details<textarea id="ds" rows="3"></textarea></label><div class="err">${S.err}</div><button class="btn" onclick="cs()">Send</button>
 ${S.cases.length?`<h2>Your cases</h2>${S.cases.map(c=>`<div class="card"><div class="row"><b>${c.cat}</b>${pill(c.s)}</div><div class="mut">${c.ref} · Owner: ${c.own}</div></div>`).join("")}`:""}`}
function cs(){if(!$("#ds").value.trim()){S.err="Add a few details so we can investigate.";return draw()}const c=S.cat,own=/Withdrawal|Balance|Contribution|Incorrect/.test(c)?"PFA (Retira tracks it)":"Retira";const x={ref:"SUP-"+Math.random().toString(16).slice(2,7).toUpperCase(),cat:c,own,s:"Pending"};S.cases.unshift(x);S.err="";draw();setTimeout(()=>{x.s="Acknowledged";draw()},2500)}
const MT=[["transfer","Bank transfer","Send the amount from your bank app or USSD. It is confirmed automatically."],["card","Debit card","Pay with a Verve, Mastercard or Visa debit card. Your bank asks for your PIN and a one-time code."]];
const STG={transfer:["Transfer reported","Payment detected","Matched to your account","PFA acknowledged","Credited to your RSA"],card:["Card verified","Payment authorised","Payment captured","PFA acknowledged","Credited to your RSA"]};
const BANKS=["Access Bank","Ecobank Nigeria","Fidelity Bank","First Bank of Nigeria","First City Monument Bank (FCMB)","Guaranty Trust Bank (GTBank)","Jaiz Bank","Keystone Bank","Kuda Bank","Moniepoint MFB","OPay","PalmPay","Polaris Bank","Providus Bank","Stanbic IBTC Bank","Sterling Bank","Union Bank","United Bank for Africa (UBA)","Unity Bank","Wema Bank","Zenith Bank"];
const VB=[["Wema Bank","79"],["Providus Bank","99"],["Titan Trust Bank","60"]];
const pf0=()=>{S.pf={st:"amt",a:0,m:"transfer",c:{}}};pf0();
const wf0=()=>{S.wf={st:"amt",a:0,x:null,bank:"",acct:"",res:null}};wf0();S.saved=[];
const mn=k=>MT.find(m=>m[0]===k)[1],spl=a=>[Math.round(a*S.split),a-Math.round(a*S.split)],rid=()=>Math.random().toString(16).slice(2,8).toUpperCase(),DT=d=>d.toLocaleString("en-GB",{dateStyle:"medium",timeStyle:"short"});
const E=m=>{const e=$(".err");if(e)e.textContent=m;else{S.err=m;draw()}};
const mmss=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const toks=s=>String(s).toUpperCase().replace(/[^A-Z\s]/g," ").split(/\s+/).filter(Boolean);
const holder=()=>S.oc.name||"Adaeze Okafor";
const nameMatch=(a,b)=>{const x=toks(a),y=toks(b),c=x.filter(t=>y.includes(t));return c.length>=Math.min(2,x.length,y.length)&&c.length>=Math.min(x.length,y.length)};
const luhn=n=>{let s=0;for(let i=0;i<n.length;i++){let d=+n[n.length-1-i];if(i%2){d*=2;if(d>9)d-=9}s+=d}return s%10===0};
const brand=n=>/^4/.test(n)?"Visa":/^(5[1-5]|2[2-7])/.test(n)?"Mastercard":/^(5061|6500|507)/.test(n)?"Verve":"";
const last4=a=>"••••"+a.slice(-4);
const phm=()=>S.oc.phone?S.oc.phone.slice(0,4)+"•••"+S.oc.phone.slice(-3):"your phone";
function rows(l){return `<div class="card">${l.map(([k,v])=>`<div class="row" style="padding:6px 0"><span class="mut">${k}</span><b style="text-align:right">${v}</b></div>`).join("")}</div>`}
function tl(T,s){return `<div class="card">${T.map((t,i)=>`<div class="row" style="padding:8px 0;justify-content:flex-start"><span class="ic" style="width:26px;height:26px;font-size:13px;background:${i<=s?"#024A27":"var(--ln)"}">${i<=s?"✓":""}</span><span style="${i<=s?"font-weight:600":"color:var(--mut)"}">${t}</span></div>`).join("")}</div>`}
const how=p=>p.m==="card"?`Debit card •••• ${p.c.l4}`:"Bank transfer";
function pay(){const p=S.pf,[c,r]=spl(p.a||0),bk=`<button class="btn sec" onclick="S.pf.st='%'">Back</button>`;
 if(p.st==="amt")return `<h1>Contribute</h1><p class="mut">Pay what suits your income. No fixed schedule.</p><label>Amount (₦)<input id="am" inputmode="numeric" value="${p.a||""}" placeholder="e.g. 10000"></label><div class="chips">${[1000,5000,10000,25000].map(x=>`<button onclick="S.pf.a=${x};draw()">${N(x)}</button>`).join("")}</div><div class="err">${S.err}</div><button class="btn" onclick="pa()">Continue</button>`;
 if(p.st==="method")return `<h1>Choose how to pay</h1><p class="mut">Paying ${N(p.a)}.</p>${MT.map(([k,t,d])=>`<label class="card chk" style="margin:8px 0;font-size:16px"><input type="radio" name="mt" ${p.m===k?"checked":""} onchange="S.pf.m='${k}'"><span><b>${t}</b><br><span class="mut">${d}</span></span></label>`).join("")}<button class="btn" onclick="pgo()">Continue</button>${bk.replace("%","amt")}`;
 if(p.st==="pay"&&p.m==="transfer")return `<h1>Transfer ${N(p.a)}</h1><p class="mut">Send the amount below from any bank app or USSD to this account. We confirm it automatically.</p><div class="card"><div class="mut">Account number</div><div class="row"><div class="acct">${p.acct}</div><button class="cp" id="cpb" onclick="cp('${p.acct}')">Copy</button></div></div>${rows([["Bank",p.vb],["Account name","PENSION CONTRIB - "+toks(holder()).join(" ")],["Amount",N(p.a)],["Reference",p.ref]])}<div class="row"><span class="mut">This account expires in</span><b id="tm">${mmss(p.exp-Date.now())}</b></div><button class="btn" onclick="pstart()">I’ve sent the money</button>${bk.replace("%","method")}`;
 if(p.st==="exp")return `<h1>Account expired</h1><div class="card"><p>This transfer account has expired. If you already sent the money, don’t send it again. Report it under Help and we’ll track it with your PFA.</p>${pill("Expired")}<p class="mut">Reference ${p.ref}</p></div><button class="btn" onclick="pgo()">Get a new account number</button><button class="btn sec" onclick="S.cat='Contribution not reflected';go('app',{tab:'help'})">Report a missing contribution</button>`;
 if(p.st==="pay")return `<h1>Pay ${N(p.a)} by card</h1>${rows([["Amount",N(p.a)],["Reference",p.ref]])}<label>Card number<input id="cn" inputmode="numeric" maxlength="23" autocomplete="off" placeholder="0000 0000 0000 0000" oninput="cfmt(this)"></label><div class="mut" id="br" style="min-height:20px"></div><div style="display:flex;gap:10px"><label style="flex:1">Expiry<input id="ce" inputmode="numeric" maxlength="5" placeholder="MM/YY" autocomplete="off" oninput="efmt(this)"></label><label style="flex:1">CVV<input id="cv" type="password" inputmode="numeric" maxlength="3" placeholder="•••" autocomplete="off"></label></div><div class="note">Demo: use 4111 1111 1111 1111 with any future expiry and any 3 digits. 4000 0000 0000 0002 is declined.</div><div class="err">${S.err}</div><button class="btn" onclick="pcard()">Pay ${N(p.a)}</button>${bk.replace("%","method")}`;
 if(p.st==="pin")return `<h1>Enter your card PIN</h1><p class="mut">Your bank needs the 4-digit PIN for card •••• ${p.c.l4} to authorise ${N(p.a)}. Demo: any 4 digits.</p><label>Card PIN<input id="pn" type="password" inputmode="numeric" maxlength="4" placeholder="••••" autocomplete="off"></label><div class="err">${S.err}</div><button class="btn" onclick="ppin()">Continue</button>${bk.replace("%","pay")}`;
 if(p.st==="otp"){const s=Math.max(0,Math.ceil((p.rs-Date.now())/1000));return `<h1>Confirm with your bank</h1><p class="mut">Enter the 6-digit OTP your bank sent to ${phm()} for card •••• ${p.c.l4}. Demo: the code is 123456.</p>${p.rsd?`<div class="note" role="status">A new code has been sent.</div>`:""}<label>OTP<input id="op" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code"></label><div class="err">${S.err}</div><button class="btn" onclick="potp()">Confirm payment</button><button class="btn sec" id="rs" onclick="rsend()" ${s>0?"disabled":""}>${s>0?"Resend code in 0:"+String(s).padStart(2,"0"):"Resend code"}</button>${bk.replace("%","pin")}`}
 if(p.st==="proc")return `<h1>Processing</h1><p class="mut">${N(p.a)} · ${how(p)}</p>${tl(STG[p.m],p.stage)}${rows([["Reference",p.ref],["Status","Pending"]])}`;
 if(p.st==="fail")return `<h1>Payment failed</h1><div class="card"><p>${p.why||"Your bank declined this payment (insufficient funds)."} You have not been charged.</p>${pill("Failed")}<p class="mut">Reference ${p.ref}</p></div><button class="btn" onclick="pgo()">Try again</button><button class="btn sec" onclick="S.pf.m='transfer';pgo()">Pay by bank transfer instead</button>`;
 return `<div class="hero"><div class="mut">Contribution successful</div><div class="big">${N(p.a)}</div></div>${rows([["Reference",p.ref],["Paid with",how(p)],["Date and time",DT(p.at)],["Contingent",N(c)],["Retirement",N(r)],["Status","Successful"]])}<p class="mut">Your PFA has acknowledged this payment and your balance is updated.</p><button class="btn" onclick="pf0();go('app',{tab:'home'})">Back to home</button><button class="btn sec" onclick="pf0();draw()">Make another contribution</button>`}
function pa(){const v=+$("#am").value;S.pf.a=v;if(!(v>=500)){S.err="Enter at least ₦500.";return draw()}S.err="";S.pf.st="method";draw()}
function pgo(){const p=S.pf,v=VB[Math.floor(Math.random()*VB.length)];p.st="pay";p.why="";p.ref="RTR-"+rid();p.exp=new Date(Date.now()+18e5);p.vb=v[0];p.acct=v[1]+String(Math.floor(Math.random()*1e8)).padStart(8,"0");S.err="";draw()}
function cp(t){try{navigator.clipboard.writeText(t)}catch(e){}const b=$("#cpb");if(b){b.textContent="Copied";setTimeout(()=>{const x=$("#cpb");if(x)x.textContent="Copy"},1500)}}
function cfmt(el){const d=el.value.replace(/\D/g,"").slice(0,19);el.value=d.replace(/(.{4})/g,"$1 ").trim();const b=$("#br");if(b)b.textContent=brand(d)}
function efmt(el){let d=el.value.replace(/\D/g,"").slice(0,4);if(d.length>2)d=d.slice(0,2)+"/"+d.slice(2);el.value=d}
function pcard(){const n=$("#cn").value.replace(/\D/g,""),e=$("#ce").value,v=$("#cv").value,m=e.match(/^(0[1-9]|1[0-2])\/(\d{2})$/);
 if(!/^\d{16,19}$/.test(n)||!luhn(n))return E("Check the card number and try again.");
 if(!m||new Date(2000+ +m[2],+m[1],0,23,59)<new Date())return E("Enter a valid expiry date (MM/YY) that has not passed.");
 if(!/^\d{3}$/.test(v))return E("Enter the 3-digit CVV on the back of your card.");
 S.pf.c={l4:n.slice(-4),br:brand(n)};S.err="";S.pf.st="pin";draw()}
function ppin(){if(!/^\d{4}$/.test($("#pn").value))return E("Enter your 4-digit card PIN.");const p=S.pf;S.err="";
 if(p.c.l4==="0002"){S.tx.unshift({ref:p.ref,d:new Date(),a:p.a,s:"Failed"});p.st="fail";return draw()}
 p.st="otp";p.rs=Date.now()+3e4;p.tries=0;p.rsd=0;draw()}
function rsend(){const p=S.pf;p.rs=Date.now()+3e4;p.rsd=1;draw()}
function potp(){const p=S.pf;if($("#op").value!=="123456"){p.tries=(p.tries||0)+1;if(p.tries>=3){S.tx.unshift({ref:p.ref,d:new Date(),a:p.a,s:"Failed"});p.st="fail";p.why="Too many incorrect codes.";S.err="";return draw()}const l=3-p.tries;return E("That code doesn’t match. "+l+" attempt"+(l>1?"s":"")+" left.")}S.err="";pstart()}
function pstart(){const p=S.pf,t={ref:p.ref,d:new Date(),a:p.a,s:"Pending"};p.stage=0;S.tx.unshift(t);p.st="proc";S.err="";draw();
 [1500,3000,4500,6000].forEach((ms,i)=>setTimeout(()=>{p.stage=i+1;if(p.stage===4){t.s="Successful";S.total+=t.a;S.last=new Date();p.at=new Date();p.st="done"}draw()},ms))}
const nxt=()=>S.nextWd&&new Date()<S.nextWd?S.nextWd:null;
function resolve(a){if(/^0+$/.test(a))return{err:"We couldn’t find this account. Check the number and bank, then try again."};if(a.endsWith("0"))return{name:"CHUKWUDI EMMANUEL OBI"};return{name:toks(holder()).reverse().join(" ")}}
function nres(now){const b=$("#bk"),a=$("#an"),r=$("#nr"),c=$("#nc"),w=S.wf;if(!b||!a||!r)return;w.bank=b.value;w.acct=a.value.replace(/\D/g,"");a.value=w.acct;w.res=null;c.disabled=true;clearTimeout(w.t);
 const k=w.acct.length;
 if(!w.bank||k<10){r.innerHTML=k&&k<10?`<p class="mut">${10-k} more digit${10-k>1?"s":""} to go</p>`:"";return}
 r.innerHTML=`<p class="mut"><span class="spin"></span>Verifying account…</p>`;
 const key=w.bank+"|"+w.acct;
 w.t=setTimeout(()=>{const bb=$("#bk"),aa=$("#an");if(!bb||!aa||bb.value+"|"+aa.value!==key)return;const x=resolve(w.acct);
  if(x.err){r.innerHTML=`<div class="err">${x.err}</div>`;return}
  const ok=nameMatch(x.name,holder());w.res={name:x.name,ok};
  r.innerHTML=`<div class="card"><div class="mut">Account name</div><b style="font-size:18px">${x.name}</b><p class="${ok?"good":"err"}" style="margin:8px 0 0">${ok?"✓ Matches the name on your pension account.":"This account is not in your name. Choose an account in the name on your pension account."}</p></div>`;
  $("#nc").disabled=!ok},now?0:700)}
function usesaved(i){const s=S.saved[i];S.wf.bank=s.bank;S.wf.acct=s.acct;draw()}
function wd(){const w=S.wf,c=cont(),e=S.firstContribDays>=90,n=nxt();
 const hist=S.wd.length?`<h2>Requests</h2>${S.wd.map(x=>`<div class="card"><div class="row"><b>${N(x.a)}</b>${pill(x.s)}</div><div class="mut">${x.ref} · ${x.bank.split(" (")[0]} ${last4(x.acct)} · ${D(x.d)}</div></div>`).join("")}`:"";
 if(w.st==="amt")return `<h1>Withdraw</h1><div class="card"><div class="mut">Available to request (contingent)</div><div style="font-size:30px;font-weight:800">${N(c)}</div><p class="mut">Retirement savings (${N(ret())}) can’t be withdrawn here.</p></div><label class="chk"><input type="checkbox" ${e?"checked":""} onchange="S.firstContribDays=this.checked?120:30;draw()">Demo: first contribution was over 3 months ago</label>${n?`<div class="note">Your next withdrawal opens on ${D(n)}. Withdrawals can be made at most once every two calendar months.</div>`:e?`<label>Amount (₦)<input id="wa" inputmode="numeric" placeholder="Up to ${N(c)}" value="${w.a||""}"></label><div class="chips"><button onclick="S.wf.a=${c};draw()">Withdraw all ${N(c)}</button></div><div class="err">${S.err}</div><button class="btn" onclick="wnext()">Continue</button>`:`<div class="note">Not eligible yet. Your first withdrawal opens three months after your first contribution. Your PFA decides on every request.</div>`}${hist}`;
 if(w.st==="dest")return `<h1>Send to bank account</h1><p class="mut">Withdrawing ${N(w.a)}. It can only go to a bank account in the name on your pension account.</p>${S.saved.length?`<div class="chips">${S.saved.map((s,i)=>`<button onclick="usesaved(${i})">${s.bank.split(" (")[0]} ${last4(s.acct)}</button>`).join("")}</div>`:""}<label>Bank<select id="bk" onchange="nres()"><option value="">Select bank</option>${BANKS.map(b=>`<option ${b===w.bank?"selected":""}>${b}</option>`).join("")}</select></label><label>Account number<input id="an" inputmode="numeric" maxlength="10" placeholder="10-digit account number" value="${w.acct}" oninput="nres()" autocomplete="off"></label><div id="nr"></div><button class="btn" id="nc" disabled onclick="wrev()">Continue</button><button class="btn sec" onclick="S.wf.st='amt';draw()">Back</button><div class="note">Demo: any 10 digits resolve to your name. Numbers ending in 0 resolve to someone else and are blocked.</div>`;
 if(w.st==="rev")return `<h1>Review withdrawal</h1>${rows([["Amount",N(w.a)],["Bank",w.bank],["Account number",w.acct],["Account name",w.res.name],["Approved by","Your PFA"],["Payment time","Within 24 hours of approval"]])}<div class="note">Withdrawals are paid only to a bank account in your own name, as registered with your PFA.</div><button class="btn" onclick="S.wf.st='auth';draw()">Continue</button><button class="btn sec" onclick="S.wf.st='dest';draw()">Back</button>`;
 if(w.st==="auth")return `<h1>Confirm it’s you</h1><p class="mut">Enter the 6-digit code sent to ${phm()}. Demo: the code is 123456.</p><label>Code<input id="otp" inputmode="numeric" maxlength="6" placeholder="••••••" autocomplete="one-time-code"></label><div class="err">${S.err}</div><button class="btn" onclick="wsend()">Submit to PFA</button><button class="btn sec" onclick="S.wf.st='rev';draw()">Back</button>`;
 const x=w.x,T=["Submitted to PFA","PFA reviewing","Approved","Payment sent to bank","Paid"];
 return `<h1>Withdrawal ${x.stage>=4?"paid":"in progress"}</h1>${tl(T,x.stage)}${rows([["Amount",N(x.a)],["Reference",x.ref],["Paid to",x.bank.split(" (")[0]+" "+last4(x.acct)],["Account name",x.name],["Status",x.s]])}${x.stage>=4?`<p class="mut">Paid ${D(new Date())}. Your next withdrawal opens ${D(S.nextWd)}.</p>`:`<p class="mut">The PFA approves and pays. Retira only shows the status.</p>`}<button class="btn" onclick="wf0();draw()">${x.stage>=4?"Done":"Back to withdraw"}</button>${hist}`}
function wnext(){const v=+$("#wa").value;S.wf.a=v;if(!(v>0)||v>cont()){S.err=`Enter an amount up to ${N(cont())}.`;return draw()}S.err="";S.wf.st="dest";draw()}
function wrev(){const w=S.wf;if(!(w.res&&w.res.ok))return;w.st="rev";draw()}
function wsend(){if($("#otp").value!=="123456")return E("That code doesn’t match. Check it and try again.");S.err="";const w=S.wf,x={ref:"WDR-"+Math.random().toString(16).slice(2,7).toUpperCase(),a:w.a,d:new Date(),s:"Pending",stage:0,bank:w.bank,acct:w.acct,name:w.res.name};S.wd.unshift(x);w.x=x;w.st="track";draw();
 [1500,3000,4500,6000].forEach((t,i)=>setTimeout(()=>{x.stage=i+1;x.s=x.stage>=4?"Paid":x.stage>=2?"Approved":"Pending";if(x.stage===4){S.total-=x.a;S.last=new Date();const d=new Date();d.setMonth(d.getMonth()+2);S.nextWd=d;if(!S.saved.some(s=>s.bank===x.bank&&s.acct===x.acct))S.saved.push({bank:x.bank,acct:x.acct})}draw()},t))}
setInterval(()=>{if(S.view!=="app"||S.tab!=="pay")return;const p=S.pf;
 if(p.st==="pay"&&p.m==="transfer"){const ms=p.exp-Date.now();if(ms<=0){p.st="exp";return draw()}const t=$("#tm");if(t)t.textContent=mmss(ms)}
 if(p.st==="otp"){const b=$("#rs");if(b){const s=Math.max(0,Math.ceil((p.rs-Date.now())/1000));b.disabled=s>0;b.textContent=s>0?"Resend code in 0:"+String(s).padStart(2,"0"):"Resend code"}}},1000);
const TABS=[["home","Home",home],["pay","Pay",pay],["wd","Withdraw",wd],["learn","FAQ",learn],["help","Help",help]];
function draw(){const a=$("#app");
 if(S.view==="splash"){$("#nav").hidden=true;a.innerHTML=`<div class="splash"><div><div class="mk">R</div><h1>Retira</h1><p>Save your way. Retire with a plan.</p></div></div>`;if(!S.t){S.t=1;setTimeout(()=>go("onb"),2200)}return}
 if(S.view==="onb"){$("#nav").hidden=true;a.innerHTML=onb();return}
 $("#nav").hidden=false;$("#nav div").innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?"on":""}" onclick="go('app',{tab:'${k}'})">${l}</button>`).join("");
 a.innerHTML=(S.toast?`<div class="note" role="status">${S.toast}</div>`:"")+TABS.find(t=>t[0]===S.tab)[2]();window.scrollTo(0,0);if(S.tab==="wd"&&S.wf.st==="dest")nres(1)}
draw();
