<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Retira</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--sf:#fff;--ink:#14261C;--mut:#5E6B63;--ln:#DDE3DE;--pri:#024A27;--onp:#fff;--acc:#8E5B1A;--ok:#1E7A45;--wa:#8E5B1A;--er:#B3261E;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media not all{:root:not([data-theme="light"]){--bg:#0B1510;--sf:#13211A;--ink:#E8F1ED;--mut:#93A89F;--ln:#2A433A;--pri:#5CB98A;--onp:#04180E;--acc:#C98B3E;--ok:#5ED197;--wa:#D9A055;--er:#FF8A80}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100%}
#app{max-width:480px;margin:0 auto;padding:16px 16px 96px}
h1{font-size:28px;line-height:1.1;margin:8px 0 6px;font-weight:800}h2{font-size:19px;margin:22px 0 8px;font-weight:600}
p{margin:6px 0}.mut{color:var(--mut);font-size:14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin:10px 0}
.hero{background:#024A27;color:#fff;border-radius:20px;padding:20px;margin:10px 0}
.hero .big{font-size:40px;font-weight:800;letter-spacing:-1px}.hero .mut{color:inherit;opacity:.8}
.bar{display:flex;height:10px;border-radius:6px;overflow:hidden;margin:12px 0 8px;background:#0003}
.bar i{display:block}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:600 16px inherit;font-family:inherit;background:var(--pri);color:var(--onp);cursor:pointer;margin-top:12px}
.btn.sec{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}.btn:disabled{opacity:.45}
input,select,textarea{width:100%;font:inherit;padding:12px;border-radius:10px;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);margin-top:4px}
label{display:block;margin-top:12px;font-weight:600;font-size:14px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px}.chk input{width:20px;height:20px;margin:2px 0 0;flex:none}
.pill{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;border:1px solid currentColor;white-space:nowrap}
.s-ok{color:var(--ok)}.s-wa{color:var(--wa)}.s-er{color:var(--er)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
nav div{display:flex;max-width:480px;width:100%}nav button{flex:1;background:none;border:0;padding:12px 2px;font:600 13px inherit;font-family:inherit;color:var(--mut);cursor:pointer;border-top:3px solid transparent}
nav button.on{color:var(--pri);border-top-color:var(--acc)}
.steps{display:flex;gap:6px;margin:6px 0 14px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--ln)}.steps i.on{background:var(--acc)}
.note{border-left:4px solid var(--acc);padding:8px 12px;background:var(--sf);border-radius:0 10px 10px 0;font-size:14px;margin:10px 0}
details{border-bottom:1px solid var(--ln);padding:10px 0}summary{font-weight:600;cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}.chips button{border:1.5px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.err{color:var(--er);font-size:14px;margin-top:6px}
.splash{position:fixed;inset:0;z-index:20;background:#024A27;color:#fff;display:grid;place-items:center;text-align:center;padding:24px}.splash h1{font-size:44px;margin:14px 0 4px}.splash p{opacity:.85;margin:0}.mk{width:84px;height:84px;border-radius:50%;background:#8E5B1A;display:grid;place-items:center;margin:0 auto;font-size:44px;font-weight:800;animation:pop .6s ease-out both}@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}@media (prefers-reduced-motion:reduce){.mk{animation:none}}
.eye{background:#fff3;color:#fff;border:0;border-radius:99px;padding:6px 12px;font:600 13px inherit;font-family:inherit;cursor:pointer}
.qa{display:flex;gap:6px;justify-content:space-between}.qa button{flex:1;background:none;border:0;color:var(--ink);font:600 12px inherit;font-family:inherit;cursor:pointer;padding:0}
.qa b{display:grid;place-items:center;width:56px;height:56px;border-radius:50%;margin:0 auto 6px;background:#024A27;color:#fff;font-size:22px}.qa button:nth-child(even) b{background:#8E5B1A}
.ic{display:grid;place-items:center;width:36px;height:36px;border-radius:50%;background:#024A27;color:#fff;flex:none;font-size:16px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
</style></head><body><div id="app"></div><nav id="nav" hidden><div></div></nav>
<script>
const N=n=>"₦"+Number(n).toLocaleString("en-NG");
const D=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
const ago=m=>new Date(Date.now()-m*864e5);
const S={view:"splash",step:0,tab:"home",err:"",amt:"",toast:"",oc:{phone:"",ok:[],nin:"",rsa:"no",ack:[]},
 total:186500,split:.4,last:new Date(),
 tx:[{ref:"RTR-4F2A91",d:ago(9),a:30000,s:"Successful"},{ref:"RTR-7C10BE",d:ago(31),a:56500,s:"Successful"},{ref:"RTR-2B88D5",d:ago(68),a:100000,s:"Successful"}],
 firstContribDays:68,wd:[],cases:[],pend:null,cat:"Contribution not reflected"};
const $=s=>document.querySelector(s),sc=s=>s==="Successful"||s==="Paid"||s==="Approved"?"s-ok":s==="Failed"||s==="Rejected"?"s-er":"s-wa";
const pill=s=>`<span class="pill ${sc(s)}">${s}</span>`;
const cont=()=>Math.round(S.total*S.split),ret=()=>S.total-cont();
const pend=()=>S.tx.filter(t=>t.s!=="Successful"&&t.s!=="Failed").length;
function go(v,x){Object.assign(S,{view:v,err:"",toast:""},x||{});draw()}
function save(k,v){S[k]=v}
const STEPS=["Phone","Eligibility","Identity","Disclosures"];
function onb(){const o=S.oc,i=S.step;let h=`<h1>Retira</h1><p class="mut">Save your way. Retire with a plan.</p><div class="steps">${STEPS.map((_,j)=>`<i class="${j<=i?"on":""}"></i>`).join("")}</div>`;
 if(i===0)h+=`<h2>Create your account</h2><label>Mobile number<input id="ph" inputmode="tel" placeholder="0803 000 0000" value="${o.phone}"></label><p class="mut">We’ll send a code to verify this number.</p><div class="err">${S.err}</div><button class="btn" onclick="n0()">Send code</button>`;
 if(i===1)h+=`<h2>Check your eligibility</h2><p class="mut">Tick what applies to you.</p>${[["I earn income outside regular salaried employment","a"],["I am 18 or older","b"],["I am a Nigerian resident with a NIN","c"]].map(([t,k])=>`<label class="chk"><input type="checkbox" ${o.ok.includes(k)?"checked":""} onchange="tg('ok','${k}')">${t}</label>`).join("")}<div class="note">Final eligibility is confirmed by your Pension Fund Administrator (PFA).</div><div class="err">${S.err}</div><button class="btn" onclick="n1()">Continue</button>`;
 if(i===2)h+=`<h2>Verify your identity</h2><label>National Identification Number (NIN)<input id="nin" inputmode="numeric" maxlength="11" value="${o.nin}" placeholder="11 digits"></label><label>Do you already have an RSA?<select id="rsa"><option value="no">No, I need a new one</option><option value="yes" ${o.rsa==="yes"?"selected":""}>Yes, with a PFA</option></select></label><p class="mut">If you already have an RSA, we’ll guide you through your existing PFA’s process so you don’t get a duplicate.</p><div class="err">${S.err}</div><button class="btn" onclick="n2()">Verify</button>`;
 if(i===3)h+=`<h2>Before you start</h2>${[["Pension savings are not ordinary savings. Only the contingent part can be withdrawn early, and only under PenCom rules.","a"],["Your PFA manages your account. A custodian holds the assets. Retira never holds your money.","b"],["Fund risk, fees and past performance come from your PFA and can change.","c"]].map(([t,k])=>`<label class="chk"><input type="checkbox" ${o.ack.includes(k)?"checked":""} onchange="tg('ack','${k}')">${t}</label>`).join("")}<div class="err">${S.err}</div><button class="btn" onclick="n3()">Submit to PFA</button>`;
 if(i===4)h+=`<div class="card"><h2 style="margin-top:0">Waiting for your PFA</h2><p class="mut">Your registration is with the PFA. Onboarding is complete only when their checks pass.</p>${pill("Pending")}</div><button class="btn" onclick="go('app',{tab:'home'})">Simulate PFA approval</button>`;
 return h}
function tg(k,v){const a=S.oc[k];a.includes(v)?a.splice(a.indexOf(v),1):a.push(v)}
function n0(){const v=$("#ph").value.replace(/\s/g,"");if(!/^0\d{10}$/.test(v)){S.err="Enter an 11-digit number starting with 0.";return draw()}S.oc.phone=v;S.step=1;S.err="";draw()}
function n1(){if(S.oc.ok.length<3){S.err="All three must apply before your PFA can review you.";return draw()}S.step=2;S.err="";draw()}
function n2(){const v=$("#nin").value;S.oc.rsa=$("#rsa").value;if(!/^\d{11}$/.test(v)){S.err="NIN verification failed: enter all 11 digits, then try again.";S.oc.nin=v;return draw()}S.oc.nin=v;S.err="";if(S.oc.rsa==="yes"){S.err="You already have an RSA. Contact your current PFA to add voluntary contributions. For this demo, choose “No” to continue.";return draw()}S.step=3;draw()}
function n3(){if(S.oc.ack.length<3){S.err="Please acknowledge all three points.";return draw()}S.step=4;S.err="";draw()}

function home(){const c=cont(),r=ret(),p=pend();
 return `<h1>Your pension</h1><div class="hero"><div class="mut">Total balance</div><div class="row"><div class="big">${S.hide?"₦ ••••••":N(S.total)}</div><button class="eye" onclick="S.hide=!S.hide;draw()">${S.hide?"Show":"Hide"}</button></div><div class="bar"><i style="width:${S.split*100}%;background:var(--acc)"></i><i style="width:${(1-S.split)*100}%;background:#fff"></i></div><div class="row"><span>Contingent ${S.hide?"••••":N(c)}</span><span>Retirement ${S.hide?"••••":N(r)}</span></div></div>
 <p class="mut">Last updated ${S.last.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"})}, ${D(S.last)}. Sample split; your PFA sets the real one.</p>
 ${p?`<div class="note">${p} contribution${p>1?"s":""} awaiting PFA acknowledgement. Not counted in your balance yet.</div>`:""}
 <h2>Recent contributions</h2>${S.tx.map(t=>`<div class="card row"><span class="ic">^</span><div style="flex:1"><b>${N(t.a)}</b><div class="mut">${D(t.d)} · ${t.ref}</div></div>${pill(t.s)}</div>`).join("")}`}
function pay(){const a=+S.amt;
 if(S.pend){const t=S.pend;return `<h1>Review payment</h1><div class="card"><div class="mut">Amount</div><div style="font-size:30px;font-weight:800">${N(t.a)}</div><p class="mut">Paid from your verified bank account through the PFA’s approved channel. Retira doesn’t hold this money.</p></div><button class="btn" id="cf" onclick="conf()">Confirm and pay</button><button class="btn sec" onclick="S.pend=null;draw()">Change amount</button>`}
 return `<h1>Contribute</h1><p class="mut">Pay what suits your income this week or month. No fixed schedule.</p><label>Amount (₦)<input id="am" inputmode="numeric" value="${S.amt}" placeholder="e.g. 10000"></label><div class="chips">${[5000,10000,25000,50000].map(x=>`<button onclick="S.amt=${x};draw()">${N(x)}</button>`).join("")}</div>${a?`<p class="mut">Sample allocation: ${N(Math.round(a*S.split))} contingent, ${N(a-Math.round(a*S.split))} retirement.</p>`:""}<div class="err">${S.err}</div><button class="btn" onclick="rev()">Review payment</button>
 <h2>Debited but not showing?</h2><p class="mut">Pending payments are never shown as successful. If it stays pending, report it.</p><button class="btn sec" onclick="S.cat='Contribution not reflected';go('app',{tab:'help'})">Report a missing contribution</button>`}
function rev(){const v=+$("#am").value;S.amt=$("#am").value;if(!(v>=1000)){S.err="Enter at least ₦1,000.";return draw()}S.pend={a:v};S.err="";draw()}
function conf(){const b=$("#cf");b.disabled=true;const t={ref:"RTR-"+Math.random().toString(16).slice(2,8).toUpperCase(),d:new Date(),a:S.pend.a,s:"Pending"};S.tx.unshift(t);S.pend=null;S.amt="";go("app",{tab:"home",toast:`Payment sent. Reference ${t.ref}. Waiting for PFA acknowledgement.`});
 setTimeout(()=>{t.s="Successful";S.total+=t.a;S.last=new Date();draw()},3500)}
function learn(){const q=[["How does this pension work?","Your contributions go into a Retirement Savings Account (RSA) run by a licensed PFA. A custodian holds the assets. Retira is the app you use to see and manage it."],["What is the contingent part?","40% of each contribution. It works like emergency or business cash: you can withdraw from it before retirement. Your PFA confirms the exact split on your account."],["When can I make my first withdrawal?","Three months after your first contribution. After that, the September 2025 guidelines allow a withdrawal at most once every two calendar months. Your PFA confirms the current limit."],["How long does a withdrawal take?","Eligible, complete requests are paid to your verified bank account, and the guidelines provide for payment within 24 hours. The PFA assesses and pays, not Retira."],["What is the retirement part?","The other 60%. It is locked and keeps growing until you reach retirement age (from 50) or face serious health grounds. It is not freely withdrawable cash."],["Who approves withdrawals?","Your PFA. Retira only sends your request and shows its status."],["What about fees and risk?","Fund 5A and 5B details, fees and past performance come from your PFA. Values can go down as well as up."],["I need help with a deceased contributor’s benefits","Use Help to start an enquiry. The PFA’s death-benefit process applies."]];
 return `<h1>FAQ</h1><p class="mut">Plain answers. Regulated advice comes from your PFA.</p>${q.map(([a,b])=>`<details><summary>${a}</summary><p class="mut">${b}</p></details>`).join("")}`}
function wd(){const e=S.firstContribDays>=90,c=cont(),w=S.wd;
 return `<h1>Withdraw</h1><div class="card"><div class="mut">Available to request (contingent)</div><div style="font-size:30px;font-weight:800">${N(c)}</div><p class="mut">Your retirement savings (${N(ret())}) can’t be withdrawn here.</p></div>
 <label class="chk"><input type="checkbox" ${S.firstContribDays<90?"":"checked"} onchange="S.firstContribDays=this.checked?120:30;draw()">Demo: first contribution was over 3 months ago</label>
 ${e?`<label>Amount (₦)<input id="wa" inputmode="numeric" placeholder="Up to ${N(c)}"></label><p class="mut">Paid to: GTBank ••••4821 (verified)</p><div class="err">${S.err}</div><button class="btn" onclick="wsub()">Authenticate and request</button>`:`<div class="note">Not eligible yet. The first withdrawal opens three months after your first contribution. This is not a promise of approval later; your PFA decides.</div><button class="btn" disabled>Request withdrawal</button>`}
 ${w.length?`<h2>Requests</h2>${w.map(x=>`<div class="card"><div class="row"><b>${N(x.a)}</b>${pill(x.s)}</div><div class="mut">${x.ref} · sent to PFA ${D(x.d)}</div></div>`).join("")}`:""}`}
function wsub(){const v=+$("#wa").value;if(!(v>0)||v>cont()){S.err=`Enter an amount up to ${N(cont())}.`;return draw()}const x={ref:"WDR-"+Math.random().toString(16).slice(2,7).toUpperCase(),a:v,d:new Date(),s:"Pending"};S.wd.unshift(x);S.err="";draw();
 setTimeout(()=>{x.s="Approved";draw()},2500);setTimeout(()=>{x.s="Paid";S.total-=v;S.last=new Date();draw()},5000)}
function help(){const cats=["Registration and onboarding","Identity verification","Contribution not reflected","Incorrect transaction status","Balance or statement discrepancy","Withdrawal request","Account information update","Other pension enquiries"];
 return `<h1>Help</h1><p class="mut">Tell us what happened. We’ll say who is responsible for fixing it.</p><label>Issue<select id="ct" onchange="S.cat=this.value">${cats.map(c=>`<option ${c===S.cat?"selected":""}>${c}</option>`).join("")}</select></label><label>Transaction reference (optional)<input id="rf" placeholder="e.g. RTR-4F2A91"></label><label>Details<textarea id="ds" rows="3"></textarea></label><div class="err">${S.err}</div><button class="btn" onclick="cs()">Send</button>
 ${S.cases.length?`<h2>Your cases</h2>${S.cases.map(c=>`<div class="card"><div class="row"><b>${c.cat}</b>${pill(c.s)}</div><div class="mut">${c.ref} · Owner: ${c.own}</div></div>`).join("")}`:""}`}
function cs(){if(!$("#ds").value.trim()){S.err="Add a few details so we can investigate.";return draw()}const c=S.cat,own=/Withdrawal|Balance|Contribution|Incorrect/.test(c)?"PFA (Retira tracks it)":"Retira";const x={ref:"SUP-"+Math.random().toString(16).slice(2,7).toUpperCase(),cat:c,own,s:"Pending"};S.cases.unshift(x);S.err="";draw();setTimeout(()=>{x.s="Acknowledged";draw()},2500)}
const TABS=[["home","Home",home],["pay","Pay",pay],["wd","Withdraw",wd],["learn","FAQ",learn],["help","Help",help]];
function draw(){const a=$("#app");
 if(S.view==="splash"){$("#nav").hidden=true;a.innerHTML=`<div class="splash"><div><div class="mk">R</div><h1>Retira</h1><p>Save your way. Retire with a plan.</p></div></div>`;if(!S.t){S.t=1;setTimeout(()=>go("onb"),2200)}return}
 if(S.view==="onb"){$("#nav").hidden=true;a.innerHTML=onb();return}
 $("#nav").hidden=false;$("#nav div").innerHTML=TABS.map(([k,l])=>`<button class="${S.tab===k?"on":""}" onclick="go('app',{tab:'${k}'})">${l}</button>`).join("");
 a.innerHTML=(S.toast?`<div class="note" role="status">${S.toast}</div>`:"")+TABS.find(t=>t[0]===S.tab)[2]();window.scrollTo(0,0)}
draw();
</script></body></html>
